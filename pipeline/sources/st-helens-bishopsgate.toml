# St Helen's Bishopsgate, City of London.
# Feeds + site examined 2026-11-17/19. robots.txt disallows /resources/all/* and /_util/login/*; no
# Crawl-delay. Permission: not yet confirmed with the church (see CLAUDE.md rule 7).
# Sunday talks only: the midweek feed (api.st-helens.org.uk/v1.0/feeds/midweek.xml) is left out.

[church]
id = "st-helens-bishopsgate"
name = "St Helen's Bishopsgate"
location = "London, UK"
websiteUrl = "https://www.st-helens.org.uk"

[rss]
# PRIMARY source: the Sunday podcast feed (iTunes id 282642731), last 20 talks. It prints passage
# and speaker but no series.
url = "https://api.st-helens.org.uk/v1.0/feeds/sunday.xml"
format = "sthelens"

[scrape]
# BACKFILL ONLY. The archive comes from a one-off crawl of /resources/talk/<id>/ pages
# (`sermon-pipeline crawl-sthelens`), committed as `snapshot`. Each build also fetches the talk page
# of any feed talk missing from the snapshot, which is where its series label is printed.
scraper = "sthelens"
snapshot = "data/st-helens-bishopsgate/talks.jsonl"
# Talks dated on a Sunday only (the archive mixes in midweek lunchtime talks).
sunday_only = true

[series]
min_book_share = 0.8
exclude = []
# "Week of talks": evangelistic mission talks, topical by design (2015: John 20, then John 1).
exclude_patterns = ["christmas", "carol", "advent", "easter", "week of talks"]
# The same sermon is preached at 9.30am + 11.15am (morning) and 4pm + 6pm (evening). Keep one copy
# per date per morning/evening: the earliest service.
one_per_service_half = true
# Weekend aways and same-day series: kept only if the passages work forward through the book.
event_patterns = ["weekend"]
# The pre-2000 archive dates talks 1 January when only the year is known.
placeholder_dates = ["01-01"]

[aliases.series]
# Typo in the 6pm label (2022): same Proverbs series, same talks and dates as the 4pm one.
"A son in search on wisdom" = "A son in search of wisdom"
# Same name spelled two ways (review-names, de-duplicated by the user 2026-11-20). The series stay
# separate (1997 and 2006; 1998 and 2010): only the name is unified.
"Sermon on the mount" = "The sermon on the mount"
"Questions of discipleship (2010)" = "Questions of discipleship"
