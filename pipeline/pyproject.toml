[project]
name = "sermon-pipeline"
version = "0.1.0"
description = "Builds library.json (see ../schema/library.schema.json) from church RSS feeds, with scraping only as a backfill."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "certifi>=2024.2.2",
    "jsonschema>=4.23",
]

[project.scripts]
sermon-pipeline = "sermon_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sermon_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
