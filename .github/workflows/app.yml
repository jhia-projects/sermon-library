name: app

on:
  pull_request:
    paths: ["app/**", "schema/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "schema/**", ".github/workflows/app.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # Catches Metro resolution problems (e.g. the ../schema imports) that tests don't.
      - run: npx expo export --platform ios --platform android --output-dir /tmp/export
# TODO: EAS build job once an Expo account / credentials are set up (see /release).
